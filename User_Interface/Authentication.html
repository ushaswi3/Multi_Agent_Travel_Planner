<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Planner — Log In / Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Authentication.css">
</head>
<body>

  <!-- LEFT ART SIDE -->
  <div class="art-side" id="artSide">
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="20" fill="#ffffff" opacity="0.14"/>
        <path d="M20 8 L24 18 L20 16 L16 18 Z" fill="#fff"/>
        <path d="M20 16 V30" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <path d="M11 30 Q20 35 29 30 L26 33 Q20 36.5 14 33 Z" fill="#fff"/>
      </svg>
      <span class="brand-text">Travel Planner</span>
      <span class="brand-badge">Multi-Agent</span>
    </div>
    <p class="tagline">Flight, Hotel, Budget and Itinerary agents work together to plan your trip — coordinated in one place.</p>

    <div class="scene-wrap">
      <svg class="scene scene-boat" viewBox="0 0 400 400" preserveAspectRatio="xMidYMax slice">
        <g class="cloud" opacity="0.5" fill="#ffffff">
          <ellipse cx="90" cy="70" rx="34" ry="13"/>
          <ellipse cx="120" cy="62" rx="22" ry="10"/>
        </g>
        <g class="cloud c2" opacity="0.4" fill="#ffffff">
          <ellipse cx="290" cy="100" rx="30" ry="11"/>
          <ellipse cx="315" cy="92" rx="18" ry="8"/>
        </g>
        <path d="M0,260 Q100,245 200,260 T400,260 V400 H0 Z" fill="#2C5897" opacity="0.55"/>
        <path d="M0,275 Q100,262 200,275 T400,275 V400 H0 Z" fill="#234B82"/>
        <g class="boat-group">
          <rect x="118" y="222" width="6" height="70" fill="#F4F8FE"/>
          <path d="M124,225 L124,280 L172,280 Z" fill="#FFFFFF"/>
          <path d="M118,235 L118,280 L84,280 Z" fill="#DCE9FB"/>
          <path d="M76,282 Q140,300 204,282 L196,295 Q140,308 84,295 Z" fill="#F4F8FE"/>
          <rect x="130" y="284" width="20" height="9" fill="#163A64"/>
        </g>
      </svg>

      <svg class="scene scene-island" viewBox="0 0 400 400" preserveAspectRatio="xMidYMax slice">
        <g class="cloud" opacity="0.5" fill="#ffffff">
          <ellipse cx="100" cy="68" rx="32" ry="12"/>
          <ellipse cx="128" cy="60" rx="20" ry="9"/>
        </g>
        <path d="M0,270 Q100,256 200,270 T400,270 V400 H0 Z" fill="#2C5897" opacity="0.55"/>
        <path d="M0,283 Q100,270 200,283 T400,283 V400 H0 Z" fill="#234B82"/>
        <ellipse cx="200" cy="296" rx="120" ry="22" fill="#3E7BC4"/>
        <g class="palm p1">
          <rect x="150" y="232" width="7" height="64" rx="3" fill="#F4F8FE"/>
          <path d="M153,234 Q120,222 100,236 Q126,234 153,244 Z" fill="#DCE9FB"/>
          <path d="M153,234 Q186,216 210,228 Q182,232 153,244 Z" fill="#DCE9FB"/>
          <path d="M153,232 Q150,200 168,188 Q156,212 153,238 Z" fill="#FFFFFF"/>
        </g>
        <g class="palm p2">
          <rect x="232" y="244" width="6" height="52" rx="3" fill="#F4F8FE"/>
          <path d="M235,246 Q210,236 196,248 Q216,246 235,254 Z" fill="#DCE9FB"/>
          <path d="M235,246 Q260,232 278,242 Q256,244 235,254 Z" fill="#DCE9FB"/>
        </g>
        <g class="palm p3">
          <rect x="100" y="252" width="5" height="44" rx="2.5" fill="#F4F8FE"/>
          <path d="M102,254 Q82,246 70,256 Q86,254 102,262 Z" fill="#DCE9FB"/>
          <path d="M102,254 Q122,242 136,250 Q118,252 102,262 Z" fill="#DCE9FB"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- RIGHT FORM SIDE -->
  <div class="form-side">
    <div class="form-card">
      <h1 id="formTitle">Welcome Back</h1>
      <p class="sub" id="formSub">Enter your account to login.</p>

      <div class="tabs-control">
        <span class="tab-indicator" id="tabIndicator"></span>
        <button class="tab active" data-tab="login" type="button">Login</button>
        <button class="tab" data-tab="signup" type="button">Sign Up</button>
      </div>

      <!-- LOGIN CONTENT -->
      <div class="content active" id="loginContent">
        <button type="button" class="google-btn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1A6.96 6.96 0 0 1 5.46 12c0-.73.13-1.43.38-2.1V7.06H2.18A11 11 0 0 0 1 12c0 1.77.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
          Continue with Google
        </button>

        <div class="divider"><span>or Log in using</span></div>

        <form id="loginForm" novalidate>
          <label>Email
            <input type="email" name="email" placeholder="you@example.com" autocomplete="email">
            <span class="err" data-err="login-email"></span>
          </label>

          <label>Password
            <div class="pw-wrap">
              <input type="password" name="password" placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="eye" data-eye>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <span class="err" data-err="login-password"></span>
          </label>

          <button type="submit" class="primary-btn">Login</button>
          <a href="#" class="forgot">Forgot password?</a>
        </form>

        <p class="switch-line">Don't have an account? <a data-switch="signup">Sign up</a></p>
      </div>

      <!-- SIGN UP CONTENT -->
      <div class="content" id="signupContent">
        <button type="button" class="google-btn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1A6.96 6.96 0 0 1 5.46 12c0-.73.13-1.43.38-2.1V7.06H2.18A11 11 0 0 0 1 12c0 1.77.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
          Continue with Google
        </button>

        <div class="divider"><span>or Sign up using</span></div>

        <form id="signupForm" novalidate>
          <label>Username
            <input type="text" name="username" placeholder="janedoe">
            <span class="err" data-err="username"></span>
          </label>

          <label>Email
            <input type="email" name="email" placeholder="you@example.com" autocomplete="email">
            <span class="err" data-err="signup-email"></span>
          </label>

          <label>Password
            <div class="pw-wrap">
              <input type="password" name="password" id="signupPassword" placeholder="••••••••" autocomplete="new-password">
              <button type="button" class="eye" data-eye>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="checklist" id="pwChecklist">
              <span data-rule="len">8+ characters</span>
              <span data-rule="upper">Uppercase letter</span>
              <span data-rule="num">Number</span>
              <span data-rule="special">Special character</span>
            </div>
            <span class="err" data-err="signup-password"></span>
          </label>

          <label>Confirm Password
            <input type="password" name="confirmPassword" placeholder="••••••••" autocomplete="new-password">
            <span class="err" data-err="confirm"></span>
          </label>

          <label class="terms">
            <input type="checkbox" name="agree">
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
          </label>
          <span class="err" data-err="agree"></span>

          <button type="submit" class="primary-btn">Create an Account</button>
        </form>

        <p class="switch-line">Already have an account? <a data-switch="login">Log in</a></p>
      </div>

    </div>
  </div>
  <script src="Authentication.js"></script>
</body>
</html>
